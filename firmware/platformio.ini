; SX1280 FLRC KISS TNC — PlatformIO configuration
; Target: Lilygo T3S3 SX1280 (ESP32-S3)

[platformio]
default_envs = t3s3

; ── Firmware (ESP32-S3) ────────────────────────────────────────────────────────
[env:t3s3]
platform                    = espressif32
board                       = lilygo-t3-s3
framework                   = arduino
board_upload.flash_size     = 4MB
board_build.partitions      = default.csv
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode      = qio

; Native USB CDC — the ESP32-S3's built-in USB appears as /dev/ttyACM0 on Linux.
; ARDUINO_USB_CDC_ON_BOOT=1 routes Serial to USB CDC automatically.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0

monitor_speed               = 115200
monitor_filters             = esp32_exception_decoder

lib_deps =
    jgromes/RadioLib @ ^6.6.0
    lovyan03/LovyanGFX @ ^1.1.16

; Local-only diagnostic build: USB CDC remains a pure KISS stream, but
; serialTxTask is watched while draining a frame and the host-backpressure
; telemetry (qTx/qRx/stxLock/stxActive/stxOff/stxAge in STATS and the OLED
; bottom row) is compiled in. Use for bench root-cause work, not deployment
; images.
[env:t3s3-serial-wdt]
extends = env:t3s3
build_flags =
    ${env:t3s3.build_flags}
    -DSERIAL_TX_WDT_DIAGNOSTICS=1

; ── Host unit tests (no hardware required) ────────────────────────────────────
[env:native]
platform    = native
test_framework = unity
build_flags = -std=c++14
